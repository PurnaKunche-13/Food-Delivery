spring.application.name=FoodExpress
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/foodexpress;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.demo.enabled=${DEMO_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@foodexpress.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
